services:
  # ============================================================================
  # 1. Database Service: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: novel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novel_platform}
    ports:
      # Loopback only: the database must never be reachable from the LAN/Internet
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-novel_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novel_network

  # ============================================================================
  # 1b. Search Service: novelsearch, a small in-house Go full-text search
  #     engine that replaces Elasticsearch (story search, optional). It speaks
  #     the same narrow REST surface the backend used to call on ES, so the
  #     Node.js integration code (search.service.ts) is unchanged.
  #     Published on localhost only.
  # ============================================================================
  search:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: novel_search
    restart: unless-stopped
    environment:
      PORT: 8091
      SNAPSHOT_PATH: /data/snapshot.json
    ports:
      - "127.0.0.1:${SEARCH_PORT:-9201}:8091"
    volumes:
      - search_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/_meta/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - novel_network

  # ============================================================================
  # 0. Gateway: nginx, the ONLY public entry point (port 3000 on the host).
  #    Real client IP, rate limits, connection caps, slow-client timeouts, image cache.
  # ============================================================================
  gateway:
    image: nginx:1.27-alpine
    container_name: novel_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - novel_network

  # ============================================================================
  # 1c. Message broker: RabbitMQ (notification queue). Management UI on localhost only.
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: novel_rabbitmq
    restart: unless-stopped
    hostname: novel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-novel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - novel_network

  # ============================================================================
  # 2. Backend RESTful API Service (Node.js / Express / Prisma)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_backend
    restart: unless-stopped
    ports:
      # Loopback only (debugging). The site reaches the API through the frontend proxy on the Docker network.
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novel_platform}?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-false}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novel}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEARCH_URL: http://search:8091
      SEARCH_INDEX: ${SEARCH_INDEX:-novel_stories}
    volumes:
      - ./uploads:/app/uploads
      - image_cache:/app/.cache # resized copies of uploaded images (safe to delete)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started # the API still works (inline fallback) if the broker is down
      search:
        condition: service_started # search falls back to SQL ILIKE if this isn't ready yet
    networks:
      - novel_network

  # ============================================================================
  # 2b. Queue worker: same image as the API, consumes notification jobs from RabbitMQ
  #     and writes them to PostgreSQL. Scale with `docker compose up -d --scale worker=3`
  #     (remove container_name first).
  # ============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novel_platform}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novel}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - novel_network

  # ============================================================================
  # 3. Frontend Service (Next.js 14 App Router)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: novel_frontend
    restart: unless-stopped
    # Not published: visitors reach it through the gateway (nginx) only
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:5000/api/v1
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      - backend
    networks:
      - novel_network

  # ============================================================================
  # Optional: pgAdmin 4 for Database Web GUI Management
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: novel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@novelhub.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - novel_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  search_data:
    driver: local
  image_cache:
    driver: local
  rabbitmq_data:
    driver: local
  gateway_cache:
    driver: local

networks:
  novel_network:
    driver: bridge
