services:
  # ============================================================================
  # 1. Database Service: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: novel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novel_platform}
    ports:
      # Loopback only: the database must never be reachable from the LAN/Internet
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-novel_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novel_network

  # ============================================================================
  # 1b. Search Service: Elasticsearch (story search, optional).
  #     Single node, security off: it is reachable only on the Docker network and
  #     127.0.0.1, like Postgres. Tuned for a small index on a small box:
  #     256 MB heap, ML/geoip/disk-watermark/log-indexing off, hard container cap.
  #     If it is down, the backend falls back to SQL ILIKE.
  # ============================================================================
  search:
    image: elasticsearch:9.5.3
    container_name: novel_search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      cluster.deprecation_indexing.enabled: "false" # no internal log/history indices
      indices.lifecycle.history_index_enabled: "false"
      node.processors: 2 # sizes thread pools; each thread costs stack + buffers
      # Heap: raise -Xms/-Xmx together (e.g. 512m) once the catalogue grows past ~50k stories.
      # Direct memory / JIT code cache default to much more than a tiny index needs.
      # No bootstrap.memory_lock: it pins every reserved page and roughly triples resident RAM.
      ES_JAVA_OPTS: -Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m -XX:ReservedCodeCacheSize=64m
    mem_limit: 768m
    ports:
      - "127.0.0.1:${SEARCH_PORT:-9201}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - novel_network

  # ============================================================================
  # 0. Gateway: nginx, the ONLY public entry point (port 3000 on the host).
  #    Real client IP, rate limits, connection caps, slow-client timeouts, image cache.
  # ============================================================================
  gateway:
    image: nginx:1.27-alpine
    container_name: novel_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - novel_network

  # ============================================================================
  # 1c. Message broker: RabbitMQ (notification queue). Management UI on localhost only.
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: novel_rabbitmq
    restart: unless-stopped
    hostname: novel-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-novel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - novel_network

  # ============================================================================
  # 2. Backend RESTful API Service (Node.js / Express / Prisma)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_backend
    restart: unless-stopped
    ports:
      # Loopback only (debugging). The site reaches the API through the frontend proxy on the Docker network.
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novel_platform}?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-false}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novel}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEARCH_URL: http://search:9200
      SEARCH_INDEX: ${SEARCH_INDEX:-novel_stories}
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports # built EPUB/PDF files (served only by the download endpoint)
      - image_cache:/app/.cache # resized copies of uploaded images (safe to delete)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started # the API still works (inline fallback) if the broker is down
      search:
        condition: service_started # search falls back to SQL ILIKE if this isn't ready yet
    networks:
      - novel_network

  # ============================================================================
  # 2b. Queue worker: same image as the API, consumes notification jobs from RabbitMQ
  #     and writes them to PostgreSQL. Scale with `docker compose up -d --scale worker=3`
  #     (remove container_name first).
  # ============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novel_platform}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novel}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - novel_network

  # ============================================================================
  # 2c. Export worker: builds EPUB/PDF downloads (queue novel.exports). Separate from the
  #     notification worker so a big manga export never delays notifications.
  # ============================================================================
  export-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_export_worker
    command: ["node", "dist/exportWorker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novel_platform}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-novel}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-1}
      EXPORT_KEEP_DAYS: ${EXPORT_KEEP_DAYS:-7}
    volumes:
      - ./uploads:/app/uploads:ro
      - ./exports:/app/exports
    mem_limit: ${EXPORT_WORKER_MEMORY:-1g}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - novel_network

  # ============================================================================
  # 3. Frontend Service (Next.js 14 App Router)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: novel_frontend
    restart: unless-stopped
    # Not published: visitors reach it through the gateway (nginx) only
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:5000/api/v1
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      - backend
    networks:
      - novel_network

  # ============================================================================
  # Optional: pgAdmin 4 for Database Web GUI Management
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: novel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@novelhub.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - novel_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  es_data:
    driver: local
  image_cache:
    driver: local
  rabbitmq_data:
    driver: local
  gateway_cache:
    driver: local

networks:
  novel_network:
    driver: bridge
