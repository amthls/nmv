# Every push and pull request: typecheck, then build the real Docker stack, scan the images for
# known critical vulnerabilities, start everything and check that the site answers.
name: CI

on:
  # Branches are checked through their PR; running on every branch push as well would double the
  # (free, limited) Actions minutes of this private repository.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR branch documents itself in Branches/<branch with / replaced by ->.md (see CLAUDE.md)
  branch-info:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branches/<branch>.md exists
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          f="Branches/$(printf '%s' "$BRANCH" | tr '/' '-').md"
          if [ ! -f "$f" ]; then
            echo "::error::Missing $f. Create the branch with: sh scripts/new-branch.sh <type>/<name> \"goal\""
            exit 1
          fi
          echo "found $f"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            backend/yarn.lock
            frontend/yarn.lock
      - name: Backend
        working-directory: backend
        run: |
          yarn install --frozen-lockfile
          npx prisma generate
          npx tsc --noEmit -p .
          yarn test
      - name: Frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          npx tsc --noEmit -p .

  # Go services: vet + tests (integration tests run against a throwaway Postgres and Redis)
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: identity_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/identity/go.mod
          cache-dependency-path: services/identity/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests
        env:
          IDENTITY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/identity_test
          IDENTITY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -count=1 ./...

  workspace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workspace_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/workspace/go.mod
          cache-dependency-path: services/workspace/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests
        env:
          WORKSPACE_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/workspace_test
        run: go test -count=1 ./...

  smoke:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Test .env (random secrets)
        run: |
          {
            echo "RABBITMQ_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "PGADMIN_DEFAULT_PASSWORD=$(openssl rand -hex 16)"
            echo "RESTIC_PASSWORD=$(openssl rand -hex 24)"
            echo "ELASTIC_PASSWORD=$(openssl rand -hex 24)"
            echo "IDENTITY_DB_PASSWORD=$(openssl rand -hex 32)"
            echo "IDENTITY_JWT_SECRET=$(openssl rand -hex 32)"
            echo "AUTH_HEADER_KEY=$(openssl rand -hex 32)"
            echo "WORKSPACE_DB_PASSWORD=$(openssl rand -hex 32)"
          } > .env

      - name: Build images
        run: docker compose build

      - name: Scan images (critical, fixable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/nmv-backend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Scan identity image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/nmv-identity:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Scan workspace image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/nmv-workspace:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/nmv-frontend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 600

      - name: Migrations
        run: sh scripts/migrate.sh

      - name: Site answers
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/v1/health >/dev/null && break
            sleep 5
          done
          curl -fsS http://localhost:3000/api/v1/health
          curl -fsS -o /dev/null -w "home %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "trending %{http_code}\n" http://localhost:3000/api/v1/stories/trending

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
