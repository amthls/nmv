# Every push and pull request: typecheck + unit/integration tests of each service. No Docker smoke run:
# the owner dropped it (2026-10-11, too slow); run the stack and scripts/*-smoke.py locally instead.
name: CI

on:
  # Branches are checked through their PR; running on every branch push as well would double the
  # (free, limited) Actions minutes of this private repository.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR branch documents itself in Branches/<branch with / replaced by ->.md (see CLAUDE.md)
  branch-info:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Branches/<branch>.md exists
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          f="Branches/$(printf '%s' "$BRANCH" | tr '/' '-').md"
          if [ ! -f "$f" ]; then
            echo "::error::Missing $f. Create the branch with: sh scripts/new-branch.sh <type>/<name> \"goal\""
            exit 1
          fi
          echo "found $f"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            catalog/yarn.lock
            frontend/yarn.lock
            services/media/yarn.lock
            services/community/yarn.lock
      - name: Backend
        working-directory: catalog
        run: |
          yarn install --frozen-lockfile
          npx prisma generate
          npx tsc --noEmit -p .
          yarn test
      - name: Frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          npx tsc --noEmit -p .
      - name: Media
        working-directory: services/media
        run: |
          yarn install --frozen-lockfile
          npx tsc --noEmit -p .
          yarn test
      - name: Community
        working-directory: services/community
        run: |
          yarn install --frozen-lockfile
          npx tsc --noEmit -p .
          yarn test

  # Go services: vet + tests (integration tests run against a throwaway Postgres and Redis)
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: identity_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/identity/go.mod
          cache-dependency-path: services/identity/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests
        env:
          IDENTITY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/identity_test
          IDENTITY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: go test -count=1 ./...

  workspace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workspace_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: services/workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/workspace/go.mod
          cache-dependency-path: services/workspace/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests
        env:
          WORKSPACE_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/workspace_test
        run: go test -count=1 ./...

  messaging:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: messaging_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/messaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/messaging/go.mod
          cache-dependency-path: services/messaging/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests
        env:
          MESSAGING_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/messaging_test
        run: go test -count=1 ./...

  library:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: library_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/library/go.mod
          cache-dependency-path: services/library/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Tests
        env:
          LIBRARY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/library_test
        run: go test -count=1 ./...

  recommender:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rec_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/recommender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/recommender/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          REC_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/rec_test
        run: python -m pytest -q tests
