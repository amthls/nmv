<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" width="240" height="250">
  <!-- Aemeath chibi badge, "heart hands". Fan art in the flat cel-shaded style of the official chibi icons.
       Ink #3a2d6b, hair #f6b4d0 / shade #e48bb6 / light #fde3ee, eyes amber with a 4-point star. -->
  <defs>
    <clipPath id="c"><circle cx="120" cy="140" r="100"/></clipPath>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset=".45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c3da"/>
      <stop offset="1" stop-color="#f2a3c6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="120" cy="140" r="100" fill="#1d2a52"/>
  <circle cx="120" cy="140" r="100" fill="none" stroke="#2c3d70" stroke-width="10"/>
  <circle cx="120" cy="140" r="108" fill="none" stroke="#dbe4f5" stroke-width="2" stroke-dasharray="0.1 6" stroke-linecap="round"/>

  <g stroke="#3a2d6b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- back hair (clipped to the badge) -->
    <g clip-path="url(#c)">
      <path d="M58 118 C46 160 50 205 40 245 L200 245 C190 205 194 160 182 118 Z" fill="#e48bb6"/>
      <path d="M62 150 C58 185 62 215 56 245 M178 150 C182 185 178 215 184 245" fill="none" stroke="#c96b9c" stroke-width="2"/>
      <!-- body: white top with lilac collar, heart hands -->
      <path d="M78 186 C88 180 152 180 162 186 L176 245 L64 245 Z" fill="#ffffff"/>
      <path d="M96 184 L120 204 L144 184" fill="#e9e3ff"/>
      <path d="M108 236 l12 -14 l12 14 z" fill="#7c8ff0"/>
      <path d="M86 222 C96 206 112 202 120 210 C128 202 144 206 154 222 C146 234 132 236 120 228 C108 236 94 234 86 222 Z" fill="#ffffff"/>
      <path d="M112 216 C112 210 120 210 120 216 C120 210 128 210 128 216 C128 222 120 226 120 228 C120 226 112 222 112 216 Z" fill="#f472b6" stroke-width="1.6"/>
      <path d="M80 224 c-6 2 -8 8 -4 12 M160 224 c6 2 8 8 4 12" fill="none" stroke="#67e8f9" stroke-width="2"/>
    </g>

    <!-- cyan feather wing (upper right, outside the badge like the reference) -->
    <path d="M150 66 C176 40 214 52 226 84 C214 78 206 80 200 84 C210 90 214 100 212 110 C202 100 192 98 184 100 C190 108 190 116 186 122 C176 106 164 96 152 92 Z" fill="url(#wing)" stroke="#22d3ee"/>
    <path d="M168 66 C182 70 196 80 204 92 M164 80 C176 86 186 94 192 104" fill="none" stroke="#22d3ee" stroke-width="1.6"/>

    <!-- face -->
    <path d="M70 128 C70 170 92 190 120 190 C148 190 170 170 170 128 Z" fill="#fff1ea"/>

    <!-- hair dome + side locks -->
    <path d="M62 140 C56 92 84 62 120 62 C156 62 184 92 178 140 C172 124 166 116 160 112 C150 104 90 104 80 112 C74 116 68 124 62 140 Z" fill="url(#hair)"/>
    <path d="M66 120 C54 150 56 186 70 214 C74 196 76 178 74 160 C78 150 80 136 78 124 Z" fill="url(#hair)"/>
    <path d="M174 120 C186 150 184 186 170 214 C166 196 164 178 166 160 C162 150 160 136 162 124 Z" fill="url(#hair)"/>

    <!-- bangs: soft side-swept strands with curved pointed tips -->
    <path d="M66 134 C66 100 92 82 120 82 C150 82 174 100 174 134 C170 126 166 121 161 118 Q160 132 157 144 Q151 129 146 118 Q142 127 136 136 Q134 123 130 112 Q126 121 122 129 Q118 119 113 110 Q108 123 101 136 Q100 124 97 115 Q92 129 85 142 Q84 129 81 120 Q74 125 66 134 Z" fill="url(#hair)"/>
    <path d="M88 96 C100 88 118 86 132 90 C120 94 104 96 88 96 Z" fill="#fde3ee" stroke="none"/>
    <path d="M106 112 Q104 124 101 134 M134 112 Q136 124 138 132 M118 100 Q120 112 121 126" fill="none" stroke="#e48bb6" stroke-width="1.6"/>
    <!-- swirl strands on the crown of the head -->
    <path d="M92 78 C100 66 116 64 124 72 C116 70 104 72 98 80 Z" fill="#e48bb6" stroke-width="2"/>
    <path d="M118 70 C128 60 146 62 152 74 C144 70 132 70 124 76 Z" fill="#e48bb6" stroke-width="2"/>

    <!-- ahoge loops -->
    <path d="M132 66 C134 46 152 38 160 46 C166 54 156 62 150 56" fill="none" stroke-width="2.8"/>
    <path d="M110 66 C104 54 92 52 88 58" fill="none" stroke-width="2.4"/>

    <!-- pink star crown with cyan rim -->
    <path d="M120 22 L126 40 L144 46 L126 52 L120 70 L114 52 L96 46 L114 40 Z" fill="#f9a8d4" stroke="#22d3ee" stroke-width="2.2"/>
    <circle cx="94" cy="54" r="3" fill="#a5f3fc" stroke="#22d3ee" stroke-width="1.4"/>
    <circle cx="146" cy="54" r="3" fill="#a5f3fc" stroke="#22d3ee" stroke-width="1.4"/>

    <!-- white wing hair clip with gold star -->
    <path d="M150 104 C152 90 162 82 172 84 C168 90 168 96 172 100 C164 104 156 106 150 104 Z" fill="#ffffff" stroke-width="2"/>
    <path d="M160 96 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 z" fill="#facc15" stroke="none"/>

    <!-- eyes -->
    <g>
      <ellipse cx="98" cy="146" rx="13" ry="16" fill="url(#iris)" stroke-width="2"/>
      <ellipse cx="142" cy="146" rx="13" ry="16" fill="url(#iris)" stroke-width="2"/>
      <path d="M98 158 c-7 0 -10 -3 -10 -6 c4 3 16 3 20 0 c0 3 -3 6 -10 6 z M142 158 c-7 0 -10 -3 -10 -6 c4 3 16 3 20 0 c0 3 -3 6 -10 6 z" fill="#fde68a" stroke="none"/>
      <!-- star highlights -->
      <path d="M98 138 l2.2 6 l6 2.2 l-6 2.2 l-2.2 6 l-2.2 -6 l-6 -2.2 l6 -2.2 z M142 138 l2.2 6 l6 2.2 l-6 2.2 l-2.2 6 l-2.2 -6 l-6 -2.2 l6 -2.2 z" fill="#ffffff" stroke="none"/>
      <circle cx="91" cy="139" r="2.6" fill="#fff" stroke="none"/>
      <circle cx="135" cy="139" r="2.6" fill="#fff" stroke="none"/>
      <!-- heavy upper lashes -->
      <path d="M82 136 C88 126 106 124 114 132 L116 128" fill="none" stroke-width="4"/>
      <path d="M158 136 C152 126 134 124 126 132 L124 128" fill="none" stroke-width="4"/>
    </g>

    <!-- blush with hatching, nose, smile -->
    <ellipse cx="84" cy="166" rx="9" ry="4.5" fill="#fbcfe8" stroke="none"/>
    <ellipse cx="156" cy="166" rx="9" ry="4.5" fill="#fbcfe8" stroke="none"/>
    <path d="M80 164 l-2 4 M85 164 l-2 4 M152 164 l-2 4 M157 164 l-2 4" stroke="#f472b6" stroke-width="1.2"/>
    <circle cx="120" cy="164" r=".9" fill="#c96b9c" stroke="none"/>
    <path d="M114 172 Q120 177 126 172" fill="none" stroke-width="2"/>
  </g>
</svg>
