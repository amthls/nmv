# Public entry point (the only container published on 0.0.0.0). Everything else is internal.
#   browser -> gateway :8080 -> /api/v1, /socket.io            -> backend :5000
#                            -> /uploads, /api/media/*         -> media :8080 (/api/media prefix stripped)
#                            -> /api/identity/*               -> identity :8080 (prefix stripped)
#                            -> /api/ws/*                     -> workspace :8080 (prefix stripped)
#                            -> everything else               -> frontend :3000
# Job: identify the real client IP (nobody can spoof it), throttle before traffic reaches Node,
# cap connections / slow clients / body sizes, and hide server details.

worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # One JSON line per request, keyed by request_id (also sent to the app and back to the browser).
  # $uri, not $request_uri: query strings (reset/verify tokens) and client IPs are never logged.
  log_format json escape=json '{"time":"$time_iso8601","service":"gateway","request_id":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,"ms":$request_time,'
    '"upstream_ms":"$upstream_response_time","bytes":$body_bytes_sent}';
  map $uri $loggable { ~^/(_next/static|uploads)/ 0; default 1; }
  access_log /dev/stdout json if=$loggable;

  # ---- real client address --------------------------------------------------------------
  # Direct visitors: $remote_addr is the real IP. Visitors through the local Cloudflare tunnel
  # arrive from loopback / the Docker gateway, and only for those hops do we believe
  # CF-Connecting-IP (a LAN attacker sending that header is ignored).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  # ---- throttling (per client IP) -------------------------------------------------------
  limit_req_status  429;
  limit_conn_status 429;
  limit_req_zone  $binary_remote_addr zone=pages:10m   rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=api:10m     rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m   rate=30r/m;
  limit_req_zone  $binary_remote_addr zone=signup:10m  rate=6r/m;
  limit_req_zone  $binary_remote_addr zone=upload:10m  rate=30r/m;
  limit_req_zone  $binary_remote_addr zone=account:10m rate=10r/m; # forgot/reset password, verify email
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ---- slow-client (slowloris) and size limits -------------------------------------------
  client_header_timeout 10s;
  client_body_timeout   20s;
  send_timeout          30s;
  keepalive_timeout     15s;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;
  client_max_body_size 2m;
  reset_timedout_connection on;

  # ---- cache for uploaded images (resized variants are immutable) --------------------------
  proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads:10m max_size=1g inactive=7d use_temp_path=off;

  # Resolve container names at request time (Docker DNS), so recreating frontend/backend does not
  # leave nginx pointing at an old IP.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  # HSTS only for visitors who came over HTTPS (Cloudflare tunnel/proxy sets X-Forwarded-Proto);
  # an empty value means nginx sends no header, so plain-http localhost is unaffected.
  map $http_x_forwarded_proto $hsts { https "max-age=15552000"; default ""; }

  server {
    listen 8080;
    set $backend_upstream  http://backend:5000;
    set $frontend_upstream http://frontend:3000;
    set $identity_upstream http://identity:8080;
    set $workspace_upstream http://workspace:8080;
    set $media_upstream http://media:8080;

    # --- who is calling: every request asks identity (auth_request), except where turned off below.
    # identity reads the nh_access cookie (and the CSRF header on writes) and answers 200 with signed
    # X-User-Id/Roles/Exp/Sig (signed in), 200 without them (guest) or 403 (write without CSRF token).
    # Each service trusts them only with a valid signature made with ITS key: X-User-Sig (USER_SIG_KEY_BACKEND) for the
    # backend, X-User-Sig-Ws (USER_SIG_KEY_WORKSPACE) / X-User-Sig-Media (USER_SIG_KEY_MEDIA) passed to the workspace /
    # media service as their X-User-Sig.
    set $auth_user_id "";
    set $auth_user_roles "";
    set $auth_user_exp "";
    set $auth_user_sig "";
    set $auth_user_sig_ws "";
    set $auth_user_sig_media "";
    auth_request /_auth;
    auth_request_set $auth_user_id    $upstream_http_x_user_id;
    auth_request_set $auth_user_roles $upstream_http_x_user_roles;
    auth_request_set $auth_user_exp   $upstream_http_x_user_exp;
    auth_request_set $auth_user_sig   $upstream_http_x_user_sig;
    auth_request_set $auth_user_sig_ws $upstream_http_x_user_sig_ws;
    auth_request_set $auth_user_sig_media $upstream_http_x_user_sig_media;
    error_page 403 = @auth_forbidden;
    error_page 500 = @auth_unavailable;
    # a service down (502) or too slow (504): nginx's own page would say nothing useful (pages: @page_down below)
    error_page 502 504 = @api_down;
    # X-Forwarded-For is OVERWRITTEN below (never appended to) so the app can trust it.
    limit_conn perip 60;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Request-Id $request_id always; # the code users quote when reporting a problem

    # NOTE: a location with its own proxy_set_header inherits NONE of these; repeat them there.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $request_id; # always ours: a client-sent id is replaced
    # Identity headers come only from auth_request: a client's own X-User-* never get through
    proxy_set_header X-User-Id $auth_user_id;
    proxy_set_header X-User-Roles $auth_user_roles;
    proxy_set_header X-User-Exp $auth_user_exp;
    proxy_set_header X-User-Sig $auth_user_sig;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Request-Id; # the app echoes ours; send it once
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # --- service-to-service endpoints are never public ------------------------------------
    location ~ ^/(api/[^/]+/)?internal(/|$) {
      auth_request off;
      return 404;
    }

    # auth_request subrequest (no body; identity sees the original method and every client header)
    location = /_auth {
      internal;
      auth_request off;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_pass $identity_upstream/internal/verify;
    }
    location @auth_forbidden {
      auth_request off;
      default_type application/json;
      return 403 '{"success":false,"message":"Yêu cầu bị từ chối (thiếu mã chống giả mạo). Hãy tải lại trang."}';
    }
    location @auth_unavailable {
      auth_request off;
      default_type application/json;
      return 503 '{"success":false,"message":"Dịch vụ đăng nhập tạm thời gián đoạn, vui lòng thử lại sau ít phút."}';
    }

    location @api_down {
      auth_request off;
      default_type application/json;
      add_header Retry-After 30 always;
      add_header X-Request-Id $request_id always;
      return 503 '{"success":false,"message":"Dịch vụ tạm thời gián đoạn, vui lòng thử lại sau ít phút (mã $request_id).","request_id":"$request_id"}';
    }
    location @page_down {
      auth_request off;
      default_type text/html;
      add_header Retry-After 30 always;
      add_header X-Request-Id $request_id always;
      return 503 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovelHub tạm gián đoạn</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f17;color:#e5e7eb;font-family:system-ui,sans-serif;text-align:center;padding:16px}p{color:#9ca3af}a{color:#a78bfa}code{color:#d1d5db}</style></head><body><main><h1>Web đang tạm gián đoạn</h1><p>Máy chủ đang khởi động lại hoặc quá tải. Thử lại sau ít phút.</p><p><a href="">Tải lại trang</a></p><p>Mã lỗi: <code>$request_id</code></p></main></body></html>';
    }

    # --- accounts: the identity service (it checks its own cookies and CSRF) ----------------
    location = /api/identity/login {
      auth_request off;
      limit_req zone=login burst=8 nodelay;
      rewrite ^/api/identity/(.*)$ /$1 break;
      proxy_pass $identity_upstream;
    }
    location = /api/identity/register {
      auth_request off;
      limit_req zone=signup burst=3 nodelay;
      rewrite ^/api/identity/(.*)$ /$1 break;
      proxy_pass $identity_upstream;
    }
    location ~ ^/api/identity/(forgot-password|reset-password|verify-email|resend-verification|change-password|change-email|confirm-email-change)$ {
      auth_request off;
      limit_req zone=account burst=5 nodelay;
      rewrite ^/api/identity/(.*)$ /$1 break;
      proxy_pass $identity_upstream;
    }
    location /api/identity/ {
      auth_request off;
      limit_req zone=api burst=40 nodelay;
      rewrite ^/api/identity/(.*)$ /$1 break;
      proxy_pass $identity_upstream;
    }

    # --- chapter workspace (history, compare, rewind); auth_request stays on: it checks the signed headers --
    location /api/ws/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Roles $auth_user_roles;
      proxy_set_header X-User-Exp $auth_user_exp;
      proxy_set_header X-User-Sig $auth_user_sig_ws; # the workspace's own signature
      rewrite ^/api/ws/(.*)$ /$1 break;
      proxy_pass $workspace_upstream;
    }

    # --- media: uploads, EPUB/PDF downloads (prefix stripped); auth_request stays on for the signed headers --
    location /api/media/upload/ {
      limit_req zone=upload burst=10 nodelay;
      client_max_body_size 26m;
      client_body_timeout 120s; # a 25MB image on a slow line
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Roles $auth_user_roles;
      proxy_set_header X-User-Exp $auth_user_exp;
      proxy_set_header X-User-Sig $auth_user_sig_media; # the media service's own signature
      rewrite ^/api/media/(.*)$ /$1 break;
      proxy_pass $media_upstream;
    }
    # EPUB/PDF downloads: stream straight through (files can be hundreds of MB)
    location ~ ^/api/media/exports/[0-9a-f-]+/download$ {
      limit_req zone=api burst=20 nodelay;
      proxy_buffering off;
      proxy_read_timeout 300s;
      send_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Roles $auth_user_roles;
      proxy_set_header X-User-Exp $auth_user_exp;
      proxy_set_header X-User-Sig $auth_user_sig_media; # the media service's own signature
      rewrite ^/api/media/(.*)$ /$1 break;
      proxy_pass $media_upstream;
    }
    location /api/media/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Roles $auth_user_roles;
      proxy_set_header X-User-Exp $auth_user_exp;
      proxy_set_header X-User-Sig $auth_user_sig_media; # the media service's own signature
      rewrite ^/api/media/(.*)$ /$1 break;
      proxy_pass $media_upstream;
    }

    # --- API ---------------------------------------------------------------------------
    location /api/v1/ {
      limit_req zone=api burst=80 nodelay;
      proxy_pass $backend_upstream;
    }

    # --- realtime pushes (Socket.IO, WebSocket only) ----------------------------------------
    location /socket.io/ {
      limit_req zone=api burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-User-Id $auth_user_id;
      proxy_set_header X-User-Roles $auth_user_roles;
      proxy_set_header X-User-Exp $auth_user_exp;
      proxy_set_header X-User-Sig $auth_user_sig;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s; # > Socket.IO ping interval (25s), so idle sockets stay open
      proxy_pass $backend_upstream;
    }

    # --- uploaded images (cached; ?w= variants are computed once) --------------------------
    location /uploads/ {
      auth_request off; # public images
      limit_req zone=api burst=200 nodelay;
      proxy_cache uploads;
      proxy_cache_valid 200 5m;            # only when the app sends no Cache-Control (?w= variants are immutable)
      proxy_cache_key "$uri$is_args$args";
      proxy_cache_lock on;                 # one media hit per missing image, however many wait
      add_header X-Cache $upstream_cache_status always;
      add_header X-Content-Type-Options nosniff always;
      proxy_pass $media_upstream;
    }

    # Next.js image optimizer: unused (images.unoptimized), never exposed
    location /_next/image {
      auth_request off;
      return 404;
    }

    # --- the website ---------------------------------------------------------------------
    location / {
      auth_request off; # pages render for guests; the browser's API calls carry the session
      error_page 502 504 = @page_down;
      limit_req zone=pages burst=120 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-User-Id "";
      proxy_set_header X-User-Roles "";
      proxy_set_header X-User-Exp "";
      proxy_set_header X-User-Sig "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass $frontend_upstream;
    }
  }
}
