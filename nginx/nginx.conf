# Public entry point (the only container published on 0.0.0.0). Everything else is internal.
#   browser -> gateway :8080 -> /api/v1, /uploads -> backend :5000
#                            -> everything else   -> frontend :3000
# Job: identify the real client IP (nobody can spoof it), throttle before traffic reaches Node,
# cap connections / slow clients / body sizes, and hide server details.

worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;   # the app logs what matters; flip on for forensics

  # ---- real client address --------------------------------------------------------------
  # Direct visitors: $remote_addr is the real IP. Visitors through the local Cloudflare tunnel
  # arrive from loopback / the Docker gateway, and only for those hops do we believe
  # CF-Connecting-IP (a LAN attacker sending that header is ignored).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  # ---- throttling (per client IP) -------------------------------------------------------
  limit_req_status  429;
  limit_conn_status 429;
  limit_req_zone  $binary_remote_addr zone=pages:10m   rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=api:10m     rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m   rate=30r/m;
  limit_req_zone  $binary_remote_addr zone=signup:10m  rate=6r/m;
  limit_req_zone  $binary_remote_addr zone=upload:10m  rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ---- slow-client (slowloris) and size limits -------------------------------------------
  client_header_timeout 10s;
  client_body_timeout   20s;
  send_timeout          30s;
  keepalive_timeout     15s;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;
  client_max_body_size 2m;
  reset_timedout_connection on;

  # ---- cache for uploaded images (resized variants are immutable) --------------------------
  proxy_cache_path /var/cache/nginx/uploads levels=1:2 keys_zone=uploads:10m max_size=1g inactive=7d use_temp_path=off;

  # Resolve container names at request time (Docker DNS), so recreating frontend/backend does not
  # leave nginx pointing at an old IP.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 8080;
    set $backend_upstream  http://backend:5000;
    set $frontend_upstream http://frontend:3000;
    # X-Forwarded-For is OVERWRITTEN below (never appended to) so the app can trust it.
    limit_conn perip 60;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # --- API ---------------------------------------------------------------------------
    location = /api/v1/auth/login {
      limit_req zone=login burst=8 nodelay;
      proxy_pass $backend_upstream;
    }
    location = /api/v1/auth/register {
      limit_req zone=signup burst=3 nodelay;
      proxy_pass $backend_upstream;
    }
    location ~ ^/api/v1/upload/ {
      limit_req zone=upload burst=10 nodelay;
      client_max_body_size 26m;
      client_body_timeout 120s; # a 25MB image on a slow line
      proxy_request_buffering off;
      proxy_pass $backend_upstream;
    }
    location /api/v1/ {
      limit_req zone=api burst=80 nodelay;
      proxy_pass $backend_upstream;
    }

    # --- uploaded images (cached; ?w= variants are computed once) --------------------------
    location /uploads/ {
      limit_req zone=api burst=200 nodelay;
      proxy_cache uploads;
      proxy_cache_valid 200 5m;            # only when the app sends no Cache-Control (?w= variants are immutable)
      proxy_cache_key "$uri$is_args$args";
      proxy_cache_lock on;                 # one backend hit per missing image, however many wait
      add_header X-Cache $upstream_cache_status always;
      add_header X-Content-Type-Options nosniff always;
      proxy_pass $backend_upstream;
    }

    # --- the website ---------------------------------------------------------------------
    location / {
      limit_req zone=pages burst=120 nodelay;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass $frontend_upstream;
    }
  }
}
